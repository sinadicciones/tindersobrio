        <noscript>
            <div style="max-width:760px;margin:40px auto;padding:24px;font-family:system-ui,-apple-system,sans-serif;line-height:1.55;color:#0F172A">
                <header>
                    <h1 style="font-size:32px;font-weight:900;line-height:1.1;margin:0 0 12px">PlanSobrio — Conoce personas para compartir planes sin alcohol ni drogas</h1>
                    <p style="font-size:17px;color:#334155;margin:0 0 8px">
                        PlanSobrio es una <strong>app para conocer personas sobrias, hacer amigos, encontrar pareja, recibir apoyo</strong> y compartir panoramas sin que el alcohol o las drogas sean el foco.
                        Ya estés en recuperación, lleves una vida sobria por elección o simplemente prefieras planes sanos, esta comunidad es tu lugar.
                    </p>
                    <p style="font-size:14px;color:#64748B;margin:0">Solo para mayores de 18 años · Comunidad moderada · Reglas claras de convivencia.</p>
                </header>

                <section style="margin-top:32px">
                    <h2 style="font-size:22px;font-weight:900;margin:0 0 12px">Cuatro maneras de conectar</h2>
                    <ul style="padding-left:20px;margin:0">
                        <li><strong>Apoyo</strong> — Personas que entienden tu proceso. Escuchar y ser escuchado, sin juicios.</li>
                        <li><strong>Amistad</strong> — Amistades reales construidas alrededor de panoramas reales: caminatas, cafés, ferias, cine.</li>
                        <li><strong>Amor</strong> — Vínculos románticos donde el foco es la persona, no la copa. Match por afinidad de planes.</li>
                        <li><strong>Grupos</strong> — Comunidades temáticas de café, deporte, cordillera, arte y cultura, con eventos abiertos.</li>
                    </ul>
                </section>

                <section style="margin-top:32px">
                    <h2 style="font-size:22px;font-weight:900;margin:0 0 12px">Match por plan, no solo por foto</h2>
                    <ol style="padding-left:20px;margin:0">
                        <li><strong>Crea tu perfil</strong> — Cuéntanos qué tipo de conexión buscas y tus panoramas favoritos.</li>
                        <li><strong>Descubre personas afines</strong> — Encuentra gente cercana con intereses y experiencias compatibles.</li>
                        <li><strong>Conversen y armen un plan</strong> — Chatea con calma, propón un panorama y conéctate a tu ritmo.</li>
                    </ol>
                </section>

                <section style="margin-top:32px">
                    <h2 style="font-size:22px;font-weight:900;margin:0 0 12px">Preguntas frecuentes</h2>
                    <h3 style="font-size:16px;margin:16px 0 4px">¿PlanSobrio es una app de citas?</h3>
                    <p style="margin:0 0 12px">Más que una app de citas. Puedes usarla para encontrar pareja, hacer amigos, recibir apoyo o sumarte a grupos y panoramas.</p>
                    <h3 style="font-size:16px;margin:16px 0 4px">¿Necesito estar en recuperación para registrarme?</h3>
                    <p style="margin:0 0 12px">No. Está abierta a toda persona mayor de 18 años que quiera conectar en un entorno sin alcohol ni drogas.</p>
                    <h3 style="font-size:16px;margin:16px 0 4px">¿PlanSobrio es gratis?</h3>
                    <p style="margin:0 0 12px">Sí, registrarte y usar la app es 100% gratis durante la beta.</p>
                    <h3 style="font-size:16px;margin:16px 0 4px">¿Cómo se verifican los perfiles?</h3>
                    <p style="margin:0 0 12px">Verificamos el correo al registrarte y tenemos moderación + sistema de reportes. Trabajando en verificación de identidad adicional.</p>
                    <h3 style="font-size:16px;margin:16px 0 4px">¿Quién está detrás de PlanSobrio?</h3>
                    <p style="margin:0 0 12px">PlanSobrio nace de <strong>Nelson González</strong>, fundador de <a href="https://sinadicciones.org" style="color:#8B5CF6">Sinadicciones.org</a> — organización chilena dedicada a acompañar procesos de recuperación de adicciones, difundir información y visibilizar historias reales.</p>
                </section>

                <section style="margin-top:32px">
                    <h2 style="font-size:22px;font-weight:900;margin:0 0 12px">Empieza ahora</h2>
                    <p><a href="/registro" style="display:inline-block;background:linear-gradient(135deg,#FF6B5E,#8B5CF6);color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:700">Crear mi cuenta gratis</a> · <a href="/login" style="color:#0F172A">Ya tengo cuenta</a></p>
                    <p style="font-size:13px;color:#64748B;margin-top:8px">Toma menos de 2 minutos. Tú decides qué información compartir.</p>
                </section>

                <footer style="margin-top:40px;padding-top:20px;border-top:1px solid #E2E8F0;font-size:13px;color:#64748B">
                    <p>Hecho con cariño desde <a href="https://sinadicciones.org" style="color:#0F172A">Sinadicciones.org</a> — <a href="/terminos" style="color:#0F172A">Términos</a> · <a href="/privacidad" style="color:#0F172A">Privacidad</a> · <a href="mailto:contacto@sinadicciones.org" style="color:#0F172A">Contacto</a></p>
                    <p>PlanSobrio no reemplaza tratamiento profesional. Si estás en crisis, contacta a Salud Responde 600 360 7777.</p>
                    <p style="margin-top:8px;font-size:12px">Activa JavaScript para acceder a la experiencia completa de PlanSobrio.</p>
                </footer>
